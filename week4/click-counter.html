<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 4: Click Counter</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      #clicker {
        font-size: 1.1rem;
        padding: 14px 32px;
        transition: background 0.3s;
      }

      #clicker.done {
        background: #16a34a;
      }
    </style>
  </head>
  <body>
    <div class="page-content">
      <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Week 4</a>
      </nav>

      <div class="card-box">
        <h1>E1 — Click Counter</h1>
        <p>Click the button 5 times and see what happens.</p>

        <button id="clicker">Click me!</button>
        <p id="count" class="counter-box">0</p>
        <p id="message" class="small">Keep clicking...</p>
      </div>
    </div>

    <script>
      const btn = document.querySelector('#clicker');
      const countText = document.querySelector('#count');
      const message = document.querySelector('#message');

      let count = 0;

      btn.addEventListener('click', () => {
        count++;
        countText.textContent = count;

        if (count >= 5) {
          btn.classList.add('done');
          message.textContent = 'Congratulations! You clicked 5 times!';
        }
      });
    </script>
  </body>
</html>
