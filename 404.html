<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Web Programming Portfolio</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .not-found {
        max-width: 680px;
        margin: 10vh auto;
        padding: 40px 24px;
        text-align: center;
        background: #fff;
        border: 1px solid #c8d4f0;
        border-radius: 16px;
        box-shadow: 0 8px 28px rgba(26, 86, 219, 0.1);
      }
      .not-found .code {
        color: #1a56db;
        font-size: clamp(4rem, 15vw, 8rem);
        font-weight: 800;
        line-height: 1;
      }
      .not-found h1 { margin: 16px 0 8px; }
      .not-found p { color: #666; }
      .not-found a {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 18px;
        border-radius: 8px;
        background: #1a56db;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      .not-found a:hover { background: #1446b5; }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div class="code" aria-hidden="true">404</div>
      <h1>Page not found</h1>
      <p>Sorry, that page isn't part of this portfolio. The address may be misspelled or the page may have moved.</p>
      <a href="index.html">Back to the portfolio</a>
    </main>
  </body>
</html>
