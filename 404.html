<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found</title>
    <style>
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #f0f4ff;
        color: #1a1a2e;
        text-align: center;
        padding: 80px 20px;
      }

      h1 {
        font-size: 3rem;
        color: #1a56db;
        margin-bottom: 12px;
      }

      a {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 18px;
        background: #1a56db;
        color: white;
        border-radius: 8px;
        text-decoration: none;
      }

      a:hover {
        background: #1446b5;
      }
    </style>
  </head>
  <body>
    <h1>404 — Oops!</h1>
    <p>Sorry, the page you are looking for doesn't exist.</p>
    <a href="/web-pro/">Back to Home</a>
  </body>
</html>
