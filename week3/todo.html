<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 3: To-Do List</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="page-content">
      <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Week 3</a>
      </nav>

      <div class="card-box">
        <h1>To-Do List</h1>
        <p>Add tasks and they will be saved in your browser.</p>

        <form id="todoForm">
          <label for="todoInput">Add a task:</label>
          <input type="text" id="todoInput" placeholder="Enter task" />
          <button type="submit">Add</button>
        </form>

        <ul id="todoList" class="todo-list"></ul>
      </div>
    </div>

    <script>
      const form = document.getElementById('todoForm');
      const input = document.getElementById('todoInput');
      const list = document.getElementById('todoList');

      let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

      function saveTasks() {
        localStorage.setItem('tasks', JSON.stringify(tasks));
      }

      function renderTasks() {
        list.innerHTML = '';

        for (let i = 0; i < tasks.length; i++) {
          const li = document.createElement('li');
          li.className = 'todo-item';
          li.innerHTML = '<span>' + tasks[i] + '</span><button class="secondary" onclick="deleteTask(' + i + ')">Delete</button>';
          list.appendChild(li);
        }
      }

      function deleteTask(index) {
        tasks.splice(index, 1);
        saveTasks();
        renderTasks();
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        const taskText = input.value;

        if (taskText) {
          tasks.push(taskText);
          saveTasks();
          renderTasks();
          input.value = '';
        }
      });

      renderTasks();
    </script>
  </body>
</html>
