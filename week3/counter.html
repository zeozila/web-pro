<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 3: Counter App</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="page-content">
      <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Week 3</a>
      </nav>

      <div class="card-box">
        <h1>Counter App</h1>
        <p>Use the buttons to increase or decrease the number.</p>
        <h2>Count: <span id="count">0</span></h2>
        <button onclick="change(1)">+ Add</button>
        <button onclick="change(-1)" class="secondary">- Subtract</button>
        <button onclick="reset()">Reset</button>
      </div>
    </div>

    <script>
      let count = 0;

      function change(amount) {
        count = count + amount;
        document.getElementById('count').textContent = count;
      }

      function reset() {
        count = 0;
        document.getElementById('count').textContent = 0;
      }
    </script>
  </body>
</html>
